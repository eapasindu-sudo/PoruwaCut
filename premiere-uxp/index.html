<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#232323; color:#e6e6e6; font-family: "Iskoola Pota","Nirmala UI","Segoe UI",sans-serif; font-size:12px; margin:0; padding:10px; }
  h1 { font-size:15px; margin:0 0 2px; } h1 span { color:#d4a24c; }
  .mute { color:#9a9a9a; }
  .sec { border:1px solid #3a3a3a; border-radius:6px; padding:8px 10px; margin:8px 0; }
  .sec > b { display:block; font-size:11px; color:#9a9a9a; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .trk { display:flex; align-items:center; padding:3px 0; border-bottom:1px solid #2e2e2e; }
  .trk .nm { flex:1; } .trk .c { color:#9a9a9a; margin-right:8px; }
  .row { display:flex; align-items:center; margin:4px 0; }
  .row label { width:120px; color:#bdbdbd; }
  .row input, .row select { flex:1; }
  input, select { background:#1b1b1b; color:#e6e6e6; border:1px solid #444; border-radius:4px; padding:3px 6px; }
  button { background:#3a3a3a; color:#e6e6e6; border:1px solid #555; border-radius:4px; padding:6px 10px; margin-right:6px; }
  button.go { background:#d4a24c; color:#1d1d1d; border:none; font-weight:bold; padding:8px 16px; }
  #bar { height:6px; background:#1b1b1b; border-radius:3px; margin:8px 0; } #bar div { height:6px; width:0; background:#d4a24c; border-radius:3px; }
  #log { background:#161616; border:1px solid #333; border-radius:4px; padding:6px; height:150px; overflow-y:scroll; font-size:11px; white-space:pre-wrap; }
  .ok { color:#5fb37a; } .bad { color:#e0645a; }
  #upd { display:none; background:#2e2a22; border:1px solid #d4a24c; border-radius:6px; padding:8px 10px; margin:8px 0; }
  #upd button { margin-top:6px; }
</style>
</head>
<body>
  <h1>Poruwa<span>Cut</span> <span id="eng" class="mute">engine…</span></h1>
  <div id="upd"><b id="updtxt"></b><div id="updnotes" class="mute"></div><button id="updbtn" class="go">Update කරන්න</button></div>
  <div class="mute">Sync කරපු multicam sequence එක open කරලා "Sequence කියවන්න" ඔබන්න.</div>

  <div class="sec">
    <b>1 · Sequence</b>
    <button id="read">Sequence කියවන්න</button>
    <div id="seqinfo" class="mute" style="margin-top:6px"></div>
    <div id="tracks"></div>
  </div>

  <div class="sec">
    <b>2 · Mode සහ settings</b>
    <div class="row"><label>Mode</label>
      <select id="mode"><option value="ceremony">පෝරුව / චාරිත්‍ර</option><option value="dance">Dance floor (beats)</option></select></div>
    <div class="row"><label>පරාසය</label>
      <select id="range"><option value="inout">Sequence In/Out points</option><option value="all">මුළු sequence එකම</option></select></div>
    <div class="row"><label>අවම shot (s)</label><input id="min_shot" type="number" placeholder="auto"></div>
    <div class="row"><label>උපරිම shot (s)</label><input id="max_shot" type="number" placeholder="auto"></div>
    <div class="row"><label>Layout</label>
      <select id="layout"><option value="stacked">Stacked (Shift+E)</option><option value="flat">Flat (V1)</option></select></div>
    <div class="row"><label>නරක කොටස්</label>
      <select id="dead"><option value="">Marker දාන්න</option><option value="1">කපා දාන්න</option></select></div>
  </div>

  <button class="go" id="go">Auto Edit ▶</button>
  <div id="bar"><div></div></div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
