<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#232323; color:#e6e6e6; font-family: "Iskoola Pota","Nirmala UI","Segoe UI",sans-serif; font-size:12px; margin:0; padding:10px 10px 4px; }
  h1 { font-size:15px; margin:0; } h1 span { color:#d4a24c; }
  .mute { color:#9a9a9a; }
  .ok { color:#5fb37a; } .bad { color:#e0645a; } .warn { color:#d4a24c; }
  .top { display:flex; align-items:baseline; }
  .top h1 { margin-right:8px; }
  #eng { font-size:11px; }
  .sec { border:1px solid #3a3a3a; border-radius:6px; padding:8px 10px; margin:8px 0; }
  .sec > b { display:block; font-size:11px; color:#9a9a9a; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .trk { display:flex; align-items:center; padding:3px 0; border-bottom:1px solid #2e2e2e; }
  .trk .nm { flex:1; } .trk .c { color:#9a9a9a; }
  .row { display:flex; align-items:center; margin:5px 0; }
  .row label { width:110px; color:#bdbdbd; }
  .row select, .row input { flex:1; }
  input, select { background:#1b1b1b; color:#e6e6e6; border:1px solid #444; border-radius:4px; padding:3px 6px; }
  button { background:#3a3a3a; color:#e6e6e6; border:1px solid #555; border-radius:4px; padding:5px 10px; }
  button.go { background:#d4a24c; color:#1d1d1d; border:none; font-weight:bold; padding:8px 18px; }
  .hint { font-size:11px; color:#8a8a8a; margin:2px 0 0 110px; }
  #upd { display:none; background:#2e2a22; border:1px solid #d4a24c; border-radius:6px; padding:8px 10px; margin:8px 0; }
  #prog { display:none; border:1px solid #3a3a3a; border-radius:6px; padding:8px 10px; margin:8px 0; }
  #prow { display:flex; align-items:baseline; }
  #pct { font-size:26px; font-weight:bold; color:#d4a24c; margin-right:10px; min-width:70px; }
  #stage { flex:1; } #eta { color:#9a9a9a; }
  #bar { height:8px; background:#1b1b1b; border-radius:4px; margin:6px 0 4px; } #bar div { height:8px; width:0; background:#d4a24c; border-radius:4px; }
  #steps { display:flex; font-size:10px; color:#6a6a6a; } #steps span { flex:1; } #steps span.on { color:#d4a24c; } #steps span.done { color:#5fb37a; }
  #cutsline { font-size:11px; color:#bdbdbd; margin-top:4px; }
  #log { background:#161616; border:1px solid #333; border-radius:4px; padding:6px; height:130px; overflow-y:scroll; font-size:11px; white-space:pre-wrap; }
  #foot { display:flex; align-items:center; justify-content:flex-end; margin-top:6px; padding-top:6px; border-top:1px solid #2e2e2e; }
  #foot .mute { margin-right:8px; font-size:11px; }
  #chk { padding:4px 10px; font-size:11px; }
</style>
</head>
<body>
  <div class="top"><h1>Poruwa<span>Cut</span></h1><span id="eng" class="mute">engine…</span></div>

  <div id="upd"><b id="updtxt"></b><div id="updnotes" class="mute"></div>
    <button id="updbtn" class="go" style="margin-top:6px">Update කරන්න</button></div>

  <div class="sec">
    <b>1 · Sequence</b>
    <div class="mute" style="margin-bottom:6px">Sync කරපු sequence එක open කරන්න (එක් කැමරාවකට එක video track එකක්).</div>
    <button id="read">Sequence කියවන්න</button>
    <div id="seqinfo" class="mute" style="margin-top:6px"></div>
    <div id="tracks"></div>
  </div>

  <div class="sec">
    <b>2 · Edit</b>
    <div class="row"><label>Event</label><select id="event"></select></div>
    <div class="row"><label>Edit වර්ගය</label>
      <select id="etype">
        <option value="multicam">Multicamera edit</option>
        <option value="stacked">Manual cutting (stacked)</option>
      </select></div>
    <div class="hint" id="etypehint"></div>
    <div class="row"><label>පරාසය</label>
      <select id="range"><option value="inout">Sequence In/Out points</option><option value="all">මුළු sequence එකම</option></select></div>
    <div class="row"><label>අවම shot (s)</label><input id="min_shot" type="text" placeholder="auto"></div>
    <div class="row"><label>උපරිම shot (s)</label><input id="max_shot" type="text" placeholder="auto"></div>
  </div>

  <button class="go" id="go">Auto Edit ▶</button>

  <div id="prog">
    <div id="prow"><span id="pct">0%</span><span id="stage">…</span><span id="eta"></span></div>
    <div id="bar"><div></div></div>
    <div id="steps"><span data-s="prepare">Sequence</span><span data-s="audio">Audio</span><span data-s="analysis">Analysis + cuts</span><span data-s="finish">ඉවර කිරීම</span></div>
    <div id="cutsline"></div>
  </div>

  <div id="log" style="margin-top:8px"></div>

  <div id="foot"><span class="mute" id="ver"></span><button id="chk">Check update</button></div>
  <script src="main.js"></script>
</body>
</html>
