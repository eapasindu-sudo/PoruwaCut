# Builds PoruwaCut_Setup_<ver>.exe + PoruwaCut_<ver>.ccx on Windows and publishes GitHub Release v<ver>.
# New release = change the number in VERSION (e.g. 0.2.0) and push to main.
# (a pushed tag v0.2.0 works too). If Release v<ver> already exists, it only builds, no publish.
# Installed copies see the new Release and offer "Update කරන්න" in the Premiere panel.
name: release

on:
  push:
    branches: [main]
    paths: ["VERSION", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { (Get-Content VERSION -Raw).Trim() }
          python build/stamp_version.py $v

      - name: Release already published?
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Release exists - build only" }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Face model (YuNet)
        run: python setup_models.py

      - name: GPU faces (onnxruntime DirectML)
        run: |
          python -m pip install onnxruntime-directml
          python tools/check_yunet_ort.py

      - name: FFmpeg (LGPL build with NVIDIA NVDEC decode)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $bin = Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force build/ffmpeg | Out-Null
          Copy-Item $bin.FullName build/ffmpeg/
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") build/ffmpeg/
          $lic = Get-ChildItem ffx -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName build/ffmpeg/LICENSE.txt }
          build/ffmpeg/ffmpeg.exe -hide_banner -hwaccels

      - name: Build engine exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --noconsole
          --name PoruwaCutEngine --icon build/icon.ico
          --add-data "web;web" --add-data "models;models"
          --collect-submodules engine
          --collect-binaries onnxruntime
          poruwacut_engine.py

      - name: Build MCP exe (PyInstaller, console, standard library only)
        run: >
          pyinstaller --noconfirm --onefile --console
          --name AutoWedMCP --icon build/icon.ico
          autowed_mcp.py

      - name: Smoke test the MCP exe
        shell: pwsh
        run: |
          $in = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' + "`n" + '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' + "`n"
          $out = $in | dist/AutoWedMCP.exe
          $out
          if (-not ($out -match "premiere_get_sequence")) { throw "MCP exe did not list its tools" }

      - name: Smoke test the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/PoruwaCutEngine/ffmpeg | Out-Null
          Copy-Item build/ffmpeg/*.exe dist/PoruwaCutEngine/ffmpeg/
          $p = Start-Process dist/PoruwaCutEngine/PoruwaCutEngine.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 2
            try { $r = Invoke-RestMethod http://127.0.0.1:7788/api/ping; $ok = $true; break } catch {}
          }
          Get-Content "$env:LOCALAPPDATA\PoruwaCut\engine.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "engine did not answer /api/ping" }
          $r | ConvertTo-Json
          $env:FFMPEG = "$PWD\build\ffmpeg\ffmpeg.exe"
          python tools/make_test_footage.py testshoot
          # the edit needs a licence: a trial from the licence server (also tests activation end to end)
          $lic = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:7788/api/license/trial -Body "{}" -ContentType "application/json"
          $lic | ConvertTo-Json
          if (-not $lic.ok) { throw "licence trial failed: $($lic.message)" }
          $body = @{ project = @{ cams = @("$PWD\testshoot\cam1_master.mp4", "$PWD\testshoot\cam2_close.mp4", "$PWD\testshoot\cam3_side.mp4"); master = 1 }; mode = "ceremony"; options = @{ cpu = $true } } | ConvertTo-Json -Depth 5
          $job = (Invoke-RestMethod -Method Post -Uri http://127.0.0.1:7788/api/edit -Body $body -ContentType "application/json").job
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 2
            $j = Invoke-RestMethod "http://127.0.0.1:7788/api/job/$job"
            if ($j.status -ne "running" -and $j.status -ne "queued") { break }
          }
          $j.log -join "`n"
          if ($j.status -ne "done") { throw "test edit failed: $($j.status)" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:7788/api/license/remove -Body "{}" -ContentType "application/json" | Out-Null
          Invoke-RestMethod -Method Post http://127.0.0.1:7788/api/quit | Out-Null
          Remove-Item -Recurse -Force dist/PoruwaCutEngine/ffmpeg

      - name: Package Premiere plugin (.ccx)
        run: python build/make_ccx.py

      - name: Package Claude extension (.mcpb)
        run: python build/make_mcpb.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DMyVersion=${{ steps.ver.outputs.version }} build/installer.iss

      - name: Compatibility copy for older installs (they look for PoruwaCut_Setup_*.exe)
        shell: pwsh
        run: |
          Get-ChildItem Output/AutoWed_Setup_*.exe | ForEach-Object { Copy-Item $_.FullName ($_.FullName -replace 'AutoWed_Setup_', 'PoruwaCut_Setup_') }
          Get-ChildItem dist/PoruwaCut_*.ccx | Where-Object { $_.Name -ne 'PoruwaCut.ccx' } | ForEach-Object { Copy-Item $_.FullName ($_.FullName -replace 'PoruwaCut_', 'AutoWed_') }

      - uses: actions/upload-artifact@v4
        with:
          name: PoruwaCut-${{ steps.ver.outputs.version }}
          path: |
            Output/*_Setup_*.exe
            dist/*_*.ccx
            dist/AutoWed_*.mcpb

      - name: Publish GitHub Release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AutoWed ${{ steps.ver.outputs.version }}
          files: |
            Output/AutoWed_Setup_*.exe
            Output/PoruwaCut_Setup_*.exe
            dist/AutoWed_*.ccx
            dist/AutoWed_*.mcpb
          generate_release_notes: true

  # ------------------------------------------------------------------ Mac (Apple Silicon) -----
  # AutoWed_<ver>_mac.pkg (engine app + ffmpeg + Premiere panel + login start) and AutoWed_<ver>_mac.mcpb.
  # Unsigned (no Apple Developer ID): first install = right-click > Open. Runs after the Windows job
  # and adds its files to the same Release.
  mac:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; else v=$(tr -d '[:space:]' < VERSION); fi
          python build/stamp_version.py "$v"

      - name: Mac files already on the Release?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.version }}
          if gh release view "v$v" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "_mac.pkg"; then
            echo "exists=true" >> $GITHUB_OUTPUT; echo "Mac pkg already published - build only"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller onnxruntime

      - name: AI models
        run: python setup_models.py

      - name: AI checks (YuNet on onnxruntime, people detector, voice detection)
        run: python tools/check_yunet_ort.py

      - name: FFmpeg cache
        id: ffcache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-7.1-lgpl-vt-arm64-v1

      - name: FFmpeg (LGPL, VideoToolbox, built from source - no Homebrew libraries)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz -o ff.tar.xz
          tar xf ff.tar.xz
          cd ffmpeg-7.1
          ./configure --disable-autodetect --disable-gpl --disable-nonfree --enable-videotoolbox --enable-audiotoolbox \
            --enable-zlib --disable-doc --disable-ffplay --disable-debug --enable-static --disable-shared \
            --extra-cflags="-mmacosx-version-min=12.0" --extra-ldflags="-mmacosx-version-min=12.0"
          make -j"$(sysctl -n hw.ncpu)" ffmpeg ffprobe
          mkdir -p ../build/ffmpeg
          cp ffmpeg ffprobe ../build/ffmpeg/
          cp COPYING.LGPLv2.1 ../build/ffmpeg/LICENSE.txt

      - name: Check FFmpeg
        run: |
          otool -L build/ffmpeg/ffmpeg
          if otool -L build/ffmpeg/ffmpeg | grep -E "/opt/homebrew|/usr/local"; then echo "links to Homebrew!"; exit 1; fi
          build/ffmpeg/ffmpeg -hide_banner -hwaccels
          build/ffmpeg/ffmpeg -hide_banner -filters | grep -E "scale_vt|hwdownload" || true

      - name: Build engine app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name PoruwaCutEngine --osx-bundle-identifier lk.endora.autowed.engine
          --add-data "web:web" --add-data "models:models"
          --collect-submodules engine
          --collect-binaries onnxruntime
          poruwacut_engine.py

      - name: Build MCP binary (PyInstaller, standard library only)
        run: pyinstaller --noconfirm --onefile --console --name AutoWedMCP autowed_mcp.py

      - name: Smoke test the MCP binary
        run: |
          out=$(printf '%s\n%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | dist/AutoWedMCP)
          echo "$out" | head -c 600
          echo "$out" | grep -q premiere_get_sequence

      - name: Smoke test the engine app
        run: |
          mkdir -p dist/PoruwaCutEngine.app/Contents/MacOS/ffmpeg
          cp build/ffmpeg/ffmpeg build/ffmpeg/ffprobe dist/PoruwaCutEngine.app/Contents/MacOS/ffmpeg/
          dist/PoruwaCutEngine.app/Contents/MacOS/PoruwaCutEngine > engine_stdout.log 2>&1 &
          ok=0
          for i in $(seq 1 40); do sleep 2; if curl -s http://127.0.0.1:7788/api/ping; then ok=1; break; fi; done
          cat "$HOME/Library/Application Support/PoruwaCut/engine.log" 2>/dev/null | tail -20 || true
          [ $ok = 1 ] || { cat engine_stdout.log; exit 1; }
          export FFMPEG="$PWD/build/ffmpeg/ffmpeg"
          python tools/make_test_footage.py testshoot
          lic=$(curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:7788/api/license/trial)
          echo "$lic"
          echo "$lic" | grep -q '"ok": *true' || { echo "licence trial failed"; exit 1; }
          body=$(python -c "import json,os; p=os.getcwd()+'/testshoot/'; print(json.dumps({'project':{'cams':[p+'cam1_master.mp4',p+'cam2_close.mp4',p+'cam3_side.mp4'],'master':1},'mode':'ceremony','options':{}}))")
          job=$(curl -s -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:7788/api/edit | python -c "import sys,json; print(json.load(sys.stdin)['job'])")
          st=running
          for i in $(seq 1 120); do
            sleep 2
            st=$(curl -s http://127.0.0.1:7788/api/job/$job | python -c "import sys,json; print(json.load(sys.stdin)['status'])")
            [ "$st" != running ] && [ "$st" != queued ] && break
          done
          curl -s http://127.0.0.1:7788/api/job/$job | python -c "import sys,json; print('\n'.join(json.load(sys.stdin)['log']))"
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:7788/api/license/remove > /dev/null || true
          curl -s -X POST http://127.0.0.1:7788/api/quit > /dev/null || true
          rm -rf dist/PoruwaCutEngine.app/Contents/MacOS/ffmpeg
          [ "$st" = done ] || { echo "test edit failed: $st"; exit 1; }

      - name: Package Premiere plugin (.ccx)
        run: python build/make_ccx.py

      - name: Package Claude extension (.mcpb)
        run: python build/make_mcpb.py

      - name: Build installer (.pkg)
        run: bash build/make_mac_pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AutoWed-mac-${{ steps.ver.outputs.version }}
          path: |
            dist/AutoWed_*_mac.pkg
            dist/AutoWed_*_mac.mcpb

      - name: Add Mac files to the GitHub Release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            dist/AutoWed_*_mac.pkg
            dist/AutoWed_*_mac.mcpb
